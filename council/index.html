<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اتاق تصمیم">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>اتاق تصمیم‌گیری</title>
<style>
:root{
    --bg:#0b141d; --panel:#17212b; --panel2:#242f3d; --line:#22344a;
    --text:#ffffff; --muted:#7f91a4; --accent:#4f8cff;
    --mehdi:#2f9e6e; --ceo:#7a5af8; --sgm:#d97706; --other:#64748b;
    --bub:#182533; --mine:#2b5278;
  }
  *{box-sizing:border-box}
  ::selection{background:rgba(79,140,255,.45)}
  body{margin:0;font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
  header{background:rgba(23,33,43,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 14px;display:flex;align-items:center;gap:11px;box-shadow:0 1px 6px rgba(0,0,0,.4);z-index:4}
  header .hava{width:42px;height:42px;border-radius:50%;background:#1e2740;box-shadow:0 0 0 2px #22344a}
  header .ht{min-width:0;flex:none}
  header h1{font-size:15.5px;margin:0;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
  header .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;flex:none}
  body.ghmode header .dot{background:#facc15;box-shadow:0 0 8px #facc15}
  #ghbar{display:none;background:#3a2f10;border-bottom:1px solid #a16207;color:#fde68a;padding:8px 14px;font-size:12.5px;line-height:2}
  body.ghmode #ghbar{display:block}
  #ghbar input{background:#17130a;border:1px solid #a16207;color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;width:210px;direction:ltr;text-align:left}
  #ghbar button{background:#a16207;color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  #tokbar{display:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;font-size:12.5px;line-height:1.9}
  #tokbar button{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  #tokBtn,#setBtn{background:none;border:0;font-size:17px;cursor:pointer;padding:2px 4px}
  header .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  header .sp{flex:1}
  header label{font-size:12px;color:var(--muted)}
  header input{background:var(--panel2);border:1px solid transparent;color:var(--text);border-radius:16px;padding:6px 12px;font-family:inherit;font-size:13px;width:86px;outline:none;transition:.15s}
  header input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.25)}
  #msgs{flex:1;overflow-y:auto;padding:14px 12px 18px;display:flex;flex-direction:column;background:
    radial-gradient(1000px 480px at 85% -10%, rgba(43,82,120,.35) 0%, rgba(11,20,29,0) 60%),
    radial-gradient(800px 420px at 8% 108%, rgba(38,64,96,.28) 0%, rgba(11,20,29,0) 55%),
    radial-gradient(rgba(255,255,255,.028) 1px, transparent 1.4px),
    var(--bg);
    background-size:auto,auto,22px 22px,auto;scrollbar-width:thin;scrollbar-color:var(--panel2) transparent}
  #msgs::-webkit-scrollbar{width:6px}
  #msgs::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
  .daysep{position:sticky;top:6px;display:flex;justify-content:center;margin:12px 0 2px;z-index:3}
  .daysep span{background:rgba(26,40,56,.94);color:#a9bdd1;font-size:11.5px;padding:3px 13px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .row{display:flex;align-items:flex-end;gap:7px;max-width:86%;align-self:flex-start;cursor:pointer;margin-top:10px}
  .row.grp{margin-top:2px}
  .row.mine{align-self:flex-end}
  .ava{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .ava.hasimg{overflow:hidden;padding:0}
  .ava.hasimg img{width:100%;height:100%;object-fit:cover;display:block}
  .ava.sp{background:transparent;box-shadow:none}
  .av-mehdi{background:linear-gradient(135deg,#37c37e,#1e8a54)} .av-ceo{background:linear-gradient(135deg,#9a7bff,#683df0)} .av-sgm{background:linear-gradient(135deg,#f6a821,#dd7a06)} .av-other{background:linear-gradient(135deg,#7d8ea3,#52657a)} .av-wally{background:linear-gradient(135deg,#4cc3e6,#1b7fa6)} .av-spark{background:linear-gradient(135deg,#f472b6,#c2437f)} .av-cooper{background:linear-gradient(135deg,#e2e8f0,#94a3b8)}
  .bub{background:var(--bub);border:1px solid rgba(255,255,255,.045);border-radius:17px 17px 17px 6px;padding:8px 12px 7px;box-shadow:0 2px 7px rgba(0,0,0,.28);min-width:120px}
  .row.mine .bub{background:linear-gradient(135deg,#31639f,#2b5278);border-color:rgba(255,255,255,.06);border-radius:17px 17px 6px 17px}
  .aname{font-weight:700;font-size:13px;margin-bottom:2px}
  .a-mehdi{color:#5cc98f} .a-ceo{color:#a78bfa} .a-sgm{color:#fbbf24} .a-other{color:#94a3b8} .a-wally{color:#4cc3e6} .a-spark{color:#f472b6} .a-cooper{color:#dbe4ee}
  .bub .body{font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
  .bub .body b{font-weight:700}
  .bub .quote{border-right:3px solid var(--accent);background:rgba(79,140,255,.12);border-radius:8px;padding:5px 9px;font-size:12.5px;color:#bcccdc;margin:2px 0 6px;white-space:pre-wrap;line-height:1.7}
  .bub .quote b{font-size:12.5px}
  .bub .quote{cursor:pointer}
  .bub .quote:active{background:rgba(79,140,255,.24)}
  .row.flash .bub{animation:flashring 1.8s ease}
  @keyframes flashring{0%,100%{box-shadow:0 2px 7px rgba(0,0,0,.28)}20%,55%{box-shadow:0 0 0 2px var(--accent),0 0 22px rgba(79,140,255,.65)}}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:#22344a;color:#e8f1fc;border:1px solid #33507a;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 8px 22px rgba(0,0,0,.45);white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .bub .meta{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:3px}
  .bub .time{color:rgba(255,255,255,.48);font-size:10.5px}
  .rbtn{background:none;border:none;color:rgba(255,255,255,.5);font-size:11.5px;padding:2px 7px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s}
  .rbtn:hover{color:#fff;background:rgba(255,255,255,.09)}
  .empty{margin:auto;color:var(--muted);font-size:13.5px;text-align:center;padding:30px 20px;line-height:2}
  #replybar{display:none;background:var(--panel);border-top:1px solid rgba(255,255,255,.05);border-right:3px solid var(--accent);padding:8px 14px;font-size:12.5px;color:var(--muted);align-items:center;gap:8px}
  #replybar b{color:var(--text)}
  #replybar button{background:none;border:none;color:var(--muted);font-size:15px;padding:2px 8px;cursor:pointer;font-family:inherit}
  footer{background:var(--panel2);border:1px solid #22344a;border-radius:30px;margin:10px 12px calc(10px + env(safe-area-inset-bottom));padding:5px 7px;display:flex;gap:4px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  footer textarea{flex:1;background:transparent;border:none;color:var(--text);border-radius:0;padding:9px 8px;font-family:inherit;font-size:15px;resize:none;max-height:120px;min-height:40px;line-height:1.65;outline:none}
  footer textarea:focus{box-shadow:none}
  footer button{width:40px;height:40px;flex:none;border-radius:50%;background:linear-gradient(135deg,#5b97ff,#2f6fe4);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 14px rgba(79,140,255,.4);transition:transform .12s}
  footer button:active{transform:scale(.93)}
  footer button svg{width:21px;height:21px;fill:#fff;transform:scaleX(-1)}
  footer button:disabled{opacity:.5}
  #fab{position:fixed;left:16px;bottom:96px;width:42px;height:42px;border-radius:50%;background:#1c2a3a;border:1px solid #2a3f55;color:#cfe1f5;display:none;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.45);cursor:pointer;z-index:5;padding:0}
  #fab svg{width:22px;height:22px;fill:currentColor}
  .hint{padding:5px 14px 8px;font-size:11px;color:var(--muted);background:var(--panel)}
  #tabs{display:flex;gap:8px;align-items:center;background:var(--panel);padding:8px 12px 2px}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 16px;font-family:inherit;font-size:13px;cursor:pointer}
  .tab.active{background:linear-gradient(135deg,#5b97ff,#2f6fe4);color:#fff;border-color:transparent}
  #dmBack{display:none;background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;cursor:pointer;padding:6px 4px}
  .member{display:flex;align-items:center;gap:11px;padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;border-radius:12px}
  .member:hover{background:rgba(255,255,255,.04)}
  .member .minfo{min-width:0;flex:1}
  .member .mname{font-weight:700;font-size:14.5px}
  .member .mlast{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .member .mtime{color:var(--muted);font-size:11px;flex:none}
  .member.unread .mlast{color:var(--text);font-weight:700}
  .ubadge{background:#e5484d;color:#fff;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;font-size:11.5px;padding:0 6px;flex:none;display:inline-block}
  #dmTabBadge{margin-inline-start:6px}
  .dmnote{color:var(--muted);font-size:12.5px;line-height:2;padding:14px 12px 6px;text-align:center}
  footer .attach{width:40px;height:40px;flex:none;border-radius:50%;background:transparent;border:none;color:#cfe1f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:none}
  footer .mic{width:40px;height:40px;flex:none;border-radius:50%;background:transparent;border:none;color:#cfe1f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:none}
  footer .mic svg{width:22px;height:22px;fill:currentColor}
  footer .mic.rec{background:#b91c1c;border-color:#ef4444;color:#fff;animation:micpulse 1s infinite}
  footer .mic.busy{opacity:.55}
  #recbar{display:none;margin:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel2);border:1px solid #22344a;border-radius:30px;padding:6px 10px;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  #recbar .recdot{width:11px;height:11px;border-radius:50%;background:#ef4444;animation:micpulse 1s infinite;flex:none}
  #rectime{font-size:14px;color:var(--text);min-width:44px}
  #reccancel{background:none;border:none;color:var(--muted);font-family:inherit;font-size:13.5px;cursor:pointer;padding:8px 10px}
  #recdone{background:linear-gradient(135deg,#5b97ff,#2f6fe4);border:none;color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;padding:9px 16px;border-radius:999px}
  #recdone:disabled,#reccancel:disabled{opacity:.5}
  @keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
  #setbar{display:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;font-size:12.5px;line-height:1.9}
  #setbar input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:6px 8px;font-size:12px;direction:ltr;text-align:left;margin-top:5px}
  #setbar select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:5px 8px;font-size:12.5px}
  footer .attach:hover{color:#fff}
  footer .attach svg{width:21px;height:21px;fill:currentColor;transform:none}
  .bub .photo{display:block;max-width:340px;width:100%;border-radius:12px;margin:2px 0 6px;cursor:zoom-in;background:#0b141d}
  .bub .photo:only-child{margin-bottom:2px}
  .bub .vid{display:block;max-width:340px;width:100%;border-radius:12px;margin:2px 0 6px;background:#000}
  .bub audio{display:block;width:100%;max-width:340px;margin:2px 0 6px}
  .filecard{display:flex;align-items:center;gap:10px;max-width:340px;background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 11px;margin:2px 0 6px;text-decoration:none;color:var(--text)}
  .fakefile{display:inline-block;background:#451a1a;color:#fca5a5;border:1px dashed #b91c1c;border-radius:8px;padding:1px 7px;font-size:11.5px}
  .filecard .fic{font-size:27px;flex:none;line-height:1}
  .filecard .fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .filecard .fmeta b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filecard .fmeta span{font-size:11.5px;color:var(--muted)}
  .filecard .fdl{flex:none;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:3px 9px}
  #pvicon{display:none;font-size:30px;flex:none;width:52px;text-align:center}
  #previewbar{display:none;background:var(--panel);border-top:1px solid rgba(255,255,255,.05);padding:9px 14px;align-items:center;gap:10px}
  #previewbar img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none}
  #previewbar .pvinfo{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #previewbar .pvinfo b{color:var(--text);display:block;font-size:13px}
  #previewbar .pvbar{height:5px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden}
  #previewbar .pvbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .2s}
  #previewbar button{background:none;border:none;color:var(--muted);font-size:16px;padding:4px 9px;cursor:pointer;font-family:inherit}
  #newpill{position:fixed;left:50%;bottom:158px;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;display:none;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  #lightbox.open{display:flex}
  #lightbox img{max-width:100%;max-height:88vh;border-radius:10px;object-fit:contain}
  #lightbox .lbclose{position:absolute;top:14px;left:16px;background:rgba(255,255,255,.12);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;font-family:inherit}
  #lightbox .lbdl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;text-decoration:none;padding:9px 22px;border-radius:999px;font-size:13.5px;font-weight:700}
  @media (max-width:560px){ .row{max-width:93%} header label{display:none} .bub .photo{max-width:100%} }
</style>
</head>
<body>
<header>
  <img class="hava" src="./icon.svg" alt="">
  <div class="ht">
    <h1><span class="dot"></span>اتاق تصمیم‌گیری</h1>
    <div class="sub" id="roomsub">مهدی، مدیرعامل، ربات SGM و سایر اعضا</div>
  </div>
  <span class="sp"></span>
  <label>نام شما:</label>
  <input id="myname" value="مهدی">
  <button id="setBtn" type="button" title="تنظیمات">⚙️</button>
</header>
<div id="ghbar"><span id="ghstatus"></span><span id="ghtokrow" style="display:none"> <input id="ghtok" type="password" placeholder="GitHub emergency token"> <button id="ghtoksave">ذخیرهٔ توکن</button></span></div>
<div id="setbar"><div style="font-weight:700">⚙️ تنظیمات</div><div style="margin-top:6px">🎙️ تبدیل صوت به متن — مدل فعال:</div><div style="display:flex;gap:6px;margin-top:4px;align-items:center"><select id="sttsel"><option value="0">مدل ۱</option><option value="1">مدل ۲</option><option value="2">مدل ۳</option><option value="3">مدل ۴</option></select><button id="sttsave" type="button">ذخیرهٔ کلیدها</button></div><div style="margin-top:4px">کلیدها در برنامهٔ گوشی از پیش قرار داده شده‌اند؛ خانه‌های زیر فقط برای استفاده در مرورگر است:</div><input id="sttk0" type="password" placeholder="کلید Model 1"><input id="sttk1" type="password" placeholder="کلید Model 2"><input id="sttk2" type="password" placeholder="کلید Model 3"><input id="sttk3" type="password" placeholder="کلید Model 4"><div id="sttState" style="margin-top:4px"></div><div style="margin-top:10px">🔑 توکن اضطراری گیت‌هاب — فقط روزی لازم می‌شود که سوپابیس قطع باشد:</div><div style="display:flex;gap:6px;margin-top:4px"><input id="ghtokN" type="password" placeholder="github_pat_..." style="flex:1"><button id="ghtoksaveN" type="button">ذخیرهٔ توکن</button></div><div id="tokState" style="margin-top:4px"></div></div>

<div id="tabs">
  <button id="tabRoom" class="tab active" type="button">اتاق اصلی</button>
  <button id="tabDM" class="tab" type="button">گفت‌وگوی خصوصی<span id="dmTabBadge" class="ubadge" style="display:none"></span></button>
  <button id="dmBack" type="button">بازگشت به فهرست اعضا</button>
</div>

<div id="msgs"></div>

<button id="fab" type="button" aria-label="رفتن به آخرین پیام"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></button>
<button id="newpill" type="button">پیام‌های جدید ↓</button>

<div id="toast"></div>
<div id="lightbox" role="dialog" aria-label="نمایش عکس">
  <button class="lbclose" id="lbclose" type="button" aria-label="بستن">✕</button>
  <img id="lbimg" src="" alt="عکس پیام">
  <a class="lbdl" id="lbdl" href="#" download>دانلود عکس</a>
</div>

<div id="replybar">
  <span>در پاسخ به <b id="replywho"></b>: <span id="replytext"></span></span>
  <span style="flex:1"></span>
  <button id="replycancel" type="button">لغو</button>
</div>

<div id="previewbar">
  <span id="pvicon"></span>
  <img id="pvimg" src="" alt="">
  <div class="pvinfo"><b id="pvname"></b><span id="pvsize"></span><div class="pvbar"><i id="pvprog"></i></div></div>
  <button id="pvcancel" type="button" aria-label="لغو عکس">✕</button>
</div>

<div id="recbar"><span class="recdot"></span><span id="rectime">۰:۰۰</span><span style="flex:1"></span><button id="reccancel" type="button">لغو</button><button id="recdone" type="button">✓ تبدیل به متن</button></div>
<footer>
  <button id="attach" class="attach" type="button" aria-label="ارسال فایل"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
  <input id="fileinput" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.rar,.7z" hidden>
  <textarea id="draft" placeholder="پیامتان را بنویسید…"></textarea>

  if (t.indexOf('audio/') === 0) return 'audio';
  const ext = (file.name || '').split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','webp','heic','heif','bmp'].includes(ext)) return 'image';
  if (['mp4','mov','webm','mkv','avi','m4v'].includes(ext)) return 'video';
  if (['mp3','m4a','ogg','wav','opus'].includes(ext)) return 'audio';

}

const DT_DAY = new Intl.DateTimeFormat('fa-IR', { timeZone: 'Asia/Tehran', year: 'numeric', month: 'numeric', day: 'numeric' });
const DT_LABEL = new Intl.DateTimeFormat('fa-IR', { timeZone: 'Asia/Tehran', weekday: 'long', day: 'numeric', month: 'long' });
function dayKeyOf(iso){ return DT_DAY.format(new Date(iso)); }
function dayLabelOf(iso){
  const k = dayKeyOf(iso);
  if (k === dayKeyOf(new Date().toISOString())) return 'امروز';
  if (k === dayKeyOf(new Date(Date.now() - 86400000).toISOString())) return 'دیروز';
  return DT_LABEL.format(new Date(iso));
}
function roomRowHtml(m, prev){
  let q = '';
  if (m.reply_to && byId[m.reply_to]) {
    const t = byId[m.reply_to];
    q = '<div class="quote" data-target="' + t.id + '" title="رفتن به پیام اصلی"><b class="' + authorClass(t.author) + '">' + esc(t.author) + '</b><br>' + fmtBody(quoteText(t)) + '</div>';
  }
  const isMine = m.author === (nameEl.value.trim() || 'مهدی');
  const newDay = !prev || dayKeyOf(prev.created_at) !== dayKeyOf(m.created_at);
  let html = '';
  if (newDay) html += '<div class="daysep"><span>' + dayLabelOf(m.created_at) + '</span></div>';
  const grouped = !newDay && !!prev && prev.author === m.author && (new Date(m.created_at) - new Date(prev.created_at) < 7 * 60000);
  const ava = isMine ? '' : (grouped ? '<div class="ava sp"></div>' : avaHtml(m.author));
  const aname = (isMine || grouped) ? '' : '<div class="aname ' + authorClass(m.author) + '">' + esc(m.author) + '</div>';
  const photo = attachHtml(m);
  const bodyHtml = (m.body || '').trim() ? '<div class="body">' + fmtBody(m.body) + '</div>' : '';
  html += '<div class="row' + (isMine ? ' mine' : '') + (grouped ? ' grp' : '') + '" data-id="' + m.id + '">' + ava +
    '<div class="bub">' + aname + q + photo + bodyHtml +
    '<div class="meta"><span class="time">' + fmtClock(m.created_at) + '</span>' +

    '</div></div>';
  return html;
}

function updateRoomSub(){
  const subEl = document.getElementById('roomsub');
  if (subEl && roomRows.length) {
    const members = new Set(roomRows.map(m => m.author)).size;

let stickToken = 0;
function stickToBottom(){
  const t = ++stickToken;
  const go = () => { if (t === stickToken) msgsEl.scrollTop = msgsEl.scrollHeight; };
  go();
  requestAnimationFrame(go);
  setTimeout(go, 80);
  setTimeout(go, 250);
  setTimeout(go, 600);
}
msgsEl.addEventListener('wheel', () => { stickToken++; }, { passive: true });
msgsEl.addEventListener('touchmove', () => { stickToken++; }, { passive: true });
function renderRoomFull(){
  let html = '';
  let prev = null;
  roomRows.forEach(m => { html += roomRowHtml(m, prev); prev = m; });
  msgsEl.innerHTML = html || '<div class="empty">هنوز پیامی نیست؛ اولین نفر باش که بحث را شروع می‌کند.</div>';
  roomRendered = true;
  dmDisplayed = false;
  updateRoomSub();
  stickToBottom();
  const pill = document.getElementById('newpill');
  if (pill) pill.style.display = 'none';
}
async function load(){
  if (view !== 'room') return;
  if (ghMode) { ghLoad(); return; }
  try {
    roomPollN++;
    if (roomFull) {
      const r = await fetch(API + "?select=*&order=created_at.desc&limit=500", { headers: HEADERS });
      if (!r.ok) return;
      const rows = (await r.json()).reverse();
      roomRows = rows;
      roomIds = new Set(rows.map(m => m.id));
      byId = {};
      rows.forEach(m => byId[m.id] = m);
      roomLastTs = rows.length ? rows[rows.length - 1].created_at : '';
      roomFull = false;
      renderRoomFull();
      return;
    }
    if (roomPollN % 20 === 0) {
      const r = await fetch(API + "?select=id&order=created_at.desc&limit=500", { headers: HEADERS });
      if (r.ok) {
        const ids = new Set((await r.json()).map(m => m.id));
        let stale = ids.size !== roomIds.size;
        if (!stale) for (const id of roomIds) { if (!ids.has(id)) { stale = true; break; } }
        if (stale) { invalidateRoom(); return load(); }
      }
    }
    if (!roomLastTs) { invalidateRoom(); return load(); }
    const r = await fetch(API + "?select=*&order=created_at.asc&created_at=gte." + encodeURIComponent(roomLastTs), { headers: HEADERS });
    if (!r.ok) return;
    const rows = await r.json();
    const fresh = rows.filter(m => !roomIds.has(m.id));
    if (!roomRendered) {
      fresh.forEach(m => { roomIds.add(m.id); byId[m.id] = m; roomRows.push(m); });
      if (fresh.length) roomLastTs = fresh[fresh.length - 1].created_at;
      renderRoomFull();
      return;
    }
    if (!fresh.length) return;
    const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 160;
    fresh.forEach(m => { roomIds.add(m.id); byId[m.id] = m; });
    let html = '';
    let prev = roomRows.length ? roomRows[roomRows.length - 1] : null;
    fresh.forEach(m => { html += roomRowHtml(m, prev); prev = m; });
    roomRows = roomRows.concat(fresh);
    roomLastTs = fresh[fresh.length - 1].created_at;
    const emptyEl = msgsEl.querySelector('.empty');
    if (emptyEl) emptyEl.remove();
    msgsEl.insertAdjacentHTML('beforeend', html);
    updateRoomSub();
    const pill = document.getElementById('newpill');
    if (nearBottom) {
      msgsEl.scrollTop = msgsEl.scrollHeight;
      if (pill) pill.style.display = 'none';
    } else if (pill) {
      pill.textContent = fresh.length + ' پیام جدید ↓';
      pill.style.display = 'block';
    }
  } catch(e) { /* silent retry next tick */ }
}

function onFilePicked(file){
  if (!file) return;
  const kind = kindOfFile(file);
  if (kind === 'image' && file.size > MAX_PHOTO) { showToastGlobal('حجم عکس باید کمتر از ۵ مگابایت باشد'); return; }
  if (kind !== 'image' && file.size > MAX_FILE) { showToastGlobal('حجم فایل باید کمتر از ۵۰ مگابایت باشد'); return; }
  clearPhoto();
  selectedFile = file;
  if (window.syncSendVis) syncSendVis();
  selectedKind = kind;
  const pvimg = document.getElementById('pvimg');
  const pvicon = document.getElementById('pvicon');

    selectedPreviewUrl = URL.createObjectURL(file);

    pvicon.style.display = 'none';
  } else {
    pvimg.style.display = 'none';
    pvicon.textContent = kind === 'video' ? '🎬' : kind === 'audio' ? '🎵' : iconFor(file.name);
    pvicon.style.display = 'block';
  }
  document.getElementById('pvname').textContent = file.name || 'فایل';
  document.getElementById('pvsize').textContent = fmtSize(file.size) + ' — برای ارسال، دکمهٔ ارسال را بزنید';
  document.getElementById('previewbar').style.display = 'flex';
  draftEl.focus();
}
function prepareImage(file){
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxSide = 1600;
      if (img.width <= maxSide && img.height <= maxSide) { resolve(file); return; }
      const scale = Math.min(maxSide / img.width, maxSide / img.height);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
function uploadPhoto(file){
  return prepareImage(file).then(blob => {
    const ext = (blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : blob.type === 'image/gif' ? 'gif' : 'jpg');
    const path = 'room/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', STORAGE + '/' + path);
      xhr.setRequestHeader('apikey', KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
      xhr.setRequestHeader('Content-Type', blob.type || 'image/jpeg');
      xhr.setRequestHeader('x-upsert', 'false');
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          const prog = document.getElementById('pvprog');
          if (prog) prog.style.width = pct + '%';
          const sz = document.getElementById('pvsize');
          if (sz) sz.textContent = 'در حال آپلود… ' + pct + '٪';
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve(STORAGE_PUBLIC + '/' + path);
        else reject(new Error('upload ' + xhr.status));
      };
      xhr.onerror = () => reject(new Error('network'));
      xhr.send(blob);
    });
  });
}
function uploadAny(file){
  const kind = selectedKind || kindOfFile(file);
  if (kind === 'image') return uploadPhoto(file).then(url => ({ url: url, kind: 'image' }));
  const ext = ((file.name || '').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
  const scope = view === 'dm' ? 'dm' : 'room';
  const path = scope + '/' + kind + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', FSTORAGE + '/' + path);
    xhr.setRequestHeader('apikey', KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const pct = Math.round(e.loaded / e.total * 100);
        const prog = document.getElementById('pvprog');
        if (prog) prog.style.width = pct + '%';
        const sz = document.getElementById('pvsize');
        if (sz) sz.textContent = 'در حال آپلود… ' + pct + '٪';
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve({ url: FSTORAGE_PUBLIC + '/' + path, kind: kind });
      else reject(new Error('upload ' + xhr.status));
    };
    xhr.onerror = () => reject(new Error('network'));
    xhr.send(file);
  });
}
async function send(){
  if (ghMode) {
    if (view === 'dm') { showToastGlobal('گفت‌وگوی خصوصی در حالت اضطراری در دسترس نیست'); return; }
    return ghSend();
  }
  if (view === 'dm') { return sendDM(); }
  const body = draftEl.value.trim();
  if (!body && !selectedFile) return;
  if (uploading) return;
  uploading = true;
  sendBtn.disabled = true;
  try {
    let att = null;

function dmUnread(rows, me){
  const map = dmReadMap(); const per = {}; let total = 0;
  rows.forEach(m => { if (m.recipient === me && m.sender !== me) { const since = map[me + '|' + m.sender] || ''; if (m.created_at > since) { per[m.sender] = (per[m.sender] || 0) + 1; total++; } } });

let dmRows = [];

function invalidateDM(){ dmFull = true; }
async function loadDM(){
  if (ghMode) return;
  try {
    const me = meName();
    if (me !== dmMe) { dmMe = me; dmFull = true; }
    dmPollN++;
    let changed = false;
    const orFilter = encodeURIComponent("(sender.eq." + me + ",recipient.eq." + me + ")");
    if (dmFull) {
      const q = API_DM + "?select=*&order=created_at.asc&limit=1000&or=" + orFilter;
      const r = await fetch(q, { headers: HEADERS });
      if (!r.ok) return;
      dmRows = await r.json();
      dmIds = new Set(dmRows.map(m => m.id));
      dmLastTs = dmRows.length ? dmRows[dmRows.length - 1].created_at : '';
      dmFull = false;
      changed = true;
    } else {
      if (dmPollN % 20 === 0) {
        const q = API_DM + "?select=id&or=" + orFilter;
        const r = await fetch(q, { headers: HEADERS });
        if (r.ok) {
          const ids = new Set((await r.json()).map(m => m.id));
          let stale = ids.size !== dmIds.size;
          if (!stale) for (const id of dmIds) { if (!ids.has(id)) { stale = true; break; } }
          if (stale) { invalidateDM(); return loadDM(); }
        }
      }
      if (!dmLastTs) { invalidateDM(); return loadDM(); }
      const q = API_DM + "?select=*&order=created_at.asc&created_at=gte." + encodeURIComponent(dmLastTs) + "&or=" + orFilter;
      const r = await fetch(q, { headers: HEADERS });
      if (!r.ok) return;
      const rows = await r.json();
      const fresh = rows.filter(m => !dmIds.has(m.id));
      if (fresh.length) {
        fresh.forEach(m => { dmIds.add(m.id); dmRows.push(m); });
        dmLastTs = fresh[fresh.length - 1].created_at;
        changed = true;
      }
    }
    paintDMBadge(dmUnread(dmRows, me).total);
    if (view !== 'dm') return;
    const sig = dmRows.length + ':' + (dmRows.length ? dmRows[dmRows.length - 1].id + ':' + dmRows[dmRows.length - 1].body.length : '') + ':' + (partner || '') + ':' + JSON.stringify(dmReadMap());
    if (!changed && sig === lastDMSig && dmDisplayed) return;
    lastDMSig = sig;
    byIdDM = {};
    dmRows.forEach(m => byIdDM[m.id] = m);
    if (partner) renderDMConv(dmRows, me); else renderDMList(dmRows, me);
  } catch(e) {}
}

function renderDMList(rows, me){
  roomRendered = false;

  rows.forEach(m => { const o = m.sender === me ? m.recipient : m.sender; if (!names.includes(o)) names.push(o); });
  const un = dmUnread(rows, me).per;
  const entries = names.filter(n => n !== me).map(n => {
    const conv = rows.filter(m => (m.sender === me && m.recipient === n) || (m.sender === n && m.recipient === me));
    return { n, last: conv.length ? conv[conv.length - 1] : null, unread: un[n] || 0 };
  });
  entries.sort((a, b) => {
    if (a.last && b.last) return a.last.created_at < b.last.created_at ? 1 : -1;
    if (a.last) return -1;
    if (b.last) return 1;
    return 0;
  });
  let html = '<div class="dmnote">گفت‌وگوی خصوصی فقط میان شما و طرف مقابل نمایش داده می‌شود.<br>تصمیم‌ها، رأی‌گیری‌ها و مصوبات همچنان در اتاق اصلی ثبت می‌ماند.</div>';

      (e.unread ? '<span class="ubadge">' + e.unread + '</span>' : '') + '</div>';
  });

  msgsEl.querySelectorAll('.member').forEach(el => {
    el.addEventListener('click', () => { partner = el.dataset.partner; setTabs(); paintDMFromCache(); loadDM(); });

function ghToken(){ try { return localStorage.getItem('council_gh_token') || ''; } catch (e) { return ''; } }
function ghHeaders(){ const h = { 'Accept': 'application/vnd.github+json' }; const t = ghToken(); if (t) h['Authorization'] = 'Bearer ' + t; return h; }
function b64dec(b64){ const bin = atob(String(b64).replace(/\s/g, '')); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0)); return new TextDecoder('utf-8').decode(bytes); }
function b64enc(str){ const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
async function ghGetFile(path){
  const r = await fetch(GH_API + path, { headers: ghHeaders() });
  if (!r.ok) throw new Error('gh ' + r.status);
  const j = await r.json();
  return { sha: j.sha, data: JSON.parse(b64dec(j.content)) };
}
function updateGhBar(){

    ? 'حالت اضطراری فعال است؛ پیام‌ها از راه گیت‌هاب با چند دقیقه تأخیر می‌رسند. در این حالت پیوست فایل و گفت‌وگوی خصوصی در دسترس نیست.'
    : 'حالت اضطراری فعال است. برای دیدن و فرستادن پیام، توکن اضطراری گیت‌هاب را وارد کنید:';
}

async function ghLoad(){
  if (!ghToken()) { updateGhBar(); return; }
  try {

    const rows = (f.data && f.data.messages) || [];
    roomRows = rows;

async function ghSend(){

  if (!ghToken()) { showToastGlobal('اول توکن اضطراری را در نوار زرد بالای صفحه وارد کنید'); return; }
  uploading = true;
  sendBtn.disabled = true;
  try {
    let cur = { sha: null, data: [] };
    try { cur = await ghGetFile('outbox.json'); } catch (e) {}
    const arr = Array.isArray(cur.data) ? cur.data : [];
    arr.push({ id: 'gh' + Date.now() + Math.floor(Math.random() * 1e6), author: nameEl.value.trim() || 'مهدی', body: body, ts: new Date().toISOString() });
    const payload = { message: 'emergency message from page', content: b64enc(JSON.stringify(arr, null, 1)) };
    if (cur.sha) payload.sha = cur.sha;
    const r = await fetch(GH_API + 'outbox.json', { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('put ' + r.status);
    draftEl.value = '';
    draftEl.style.height = 'auto';
    replyTo = null;
    replybar.style.display = 'none';
    showToastGlobal('پیام در صف اضطراری ثبت شد؛ تا چند دقیقهٔ دیگر در اتاق می‌نشیند');
    setTimeout(ghLoad, 4000);
  } catch (e) {
    showToastGlobal('ارسال اضطراری ناموفق بود؛ دوباره تلاش کنید');
  } finally { uploading = false; sendBtn.disabled = false; }
}

// ===== STT: push-to-talk voice-to-text via Gemini (keys stay on this device) =====
const STT_MODELS = ['gemini-3.5-transcribe','gemini-3.5-flash','gemini-3.6-flash'];
const micBtn = document.getElementById('mic');
const sttBar = document.getElementById('setbar'), sttState = document.getElementById('sttState');
function sttKeys(){ try { const a = JSON.parse(localStorage.getItem('council_stt_keys')||'[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
function sttSel(){ const i = parseInt(localStorage.getItem('council_stt_sel')||'0',10); return (i>=0&&i<4)?i:0; }
{ const ks = sttKeys(); for (let i=0;i<4;i++){ const inp = document.getElementById('sttk'+i); if (ks[i]) inp.value = ks[i]; } }
document.getElementById('sttsel').value = String(sttSel());
document.getElementById('sttsel').addEventListener('change', e=>{ localStorage.setItem('council_stt_sel', e.target.value); });
function saveSttKeys(){ const arr=[0,1,2,3].map(i=>document.getElementById('sttk'+i).value.trim()); localStorage.setItem('council_stt_keys', JSON.stringify(arr)); sttState.textContent = 'کلیدها روی همین دستگاه ذخیره شد.'; }
document.getElementById('sttsave').addEventListener('click', saveSttKeys);
let sttRec = null;
async function sttStart(e){ if (e && e.preventDefault) e.preventDefault(); if (sttRec) return;
  if (!sttKeys()[sttSel()]) { showToastGlobal('کلید صوتی روی این دستگاه نیست؛ نسخهٔ تازهٔ برنامه را نصب کنید'); sttBar.style.display='block'; sttState.textContent='کلید مدل انتخاب‌شده در این دستگاه نیست؛ از تنظیمات واردش کنید.'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096,1,1); const chunks=[]; let len=0;
    proc.onaudioprocess = ev => { const d = ev.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d)); len += d.length; };
    src.connect(proc); proc.connect(ctx.destination);
    sttRec = {stream, ctx, proc, src, chunks, len};
    micBtn.classList.add('rec');
  } catch(err){ showToastGlobal('میکروفون در دسترس نیست: ' + (err && err.name ? err.name : err)); sttBar.style.display='block'; sttState.textContent='دسترسی میکروفون داده نشد: ' + (err && err.message ? err.message : err); }
}
function wavEncode(pcm, sr){ const buf = new ArrayBuffer(44 + pcm.length*2); const v = new DataView(buf);
  const wstr=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
  wstr(0,'RIFF'); v.setUint32(4, 36 + pcm.length*2, true); wstr(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); wstr(36,'data'); v.setUint32(40, pcm.length*2, true);
  for(let i=0;i<pcm.length;i++) v.setInt16(44+i*2, pcm[i], true); return buf; }
function bufToB64(buf){ let bin=''; const bytes=new Uint8Array(buf); const CH=0x8000; for(let i=0;i<bytes.length;i+=CH){ bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH)); } return btoa(bin); }
async function sttTranscribe(b64){
  const keys = sttKeys(); const order = []; const s0 = sttSel();
  for (let k=0;k<4;k++){ const idx=(s0+k)%4; if (keys[idx]) order.push(keys[idx]); }
  if (!order.length) throw new Error('کلیدی وارد نشده است');
  let lastErr = 'خطای نامشخص';
  for (const key of order){ for (const model of STT_MODELS){
    try {
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({contents:[{parts:[{text:'این فایل صوتی را دقیقاً به متن تبدیل کن؛ فقط متن گفتار را برگردان، بدون هیچ توضیح اضافه.'},{inline_data:{mime_type:'audio/wav', data:b64}}]}]})});
      const d = await res.json().catch(()=>({}));
      if (!res.ok){ lastErr = (d.error && d.error.message) || ('HTTP '+res.status); if (res.status===429 || res.status===400 || res.status===403) break; continue; }
      const parts = d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts;
      const t = parts ? parts.map(p=>p.text||'').join('').trim() : '';
      if (t) return t; lastErr = 'پاسخ خالی از مدل';
    } catch(e){ lastErr = e.message; }
  } }
  throw new Error(lastErr);
}
async function sttFinish(ok){ if (!sttRec) { recHide(); return; } const r = sttRec; sttRec = null; micBtn.classList.remove('rec');
  if (recTimer) { clearInterval(recTimer); recTimer=null; }
  if (!ok) { try { r.proc.disconnect(); r.src.disconnect(); } catch(e){} r.stream.getTracks().forEach(t=>t.stop()); try { r.ctx.close(); } catch(e){} recHide(); return; }
  recDoneBtn.disabled = true; recCancelBtn.disabled = true; recTimeEl.textContent = 'در حال تبدیل…';
  try { r.proc.disconnect(); r.src.disconnect(); } catch(e){}
  r.stream.getTracks().forEach(t=>t.stop());
  const sr = r.ctx.sampleRate; try { r.ctx.close(); } catch(e){}
  if (!r.len) { recHide(); return; }
  const merged = new Float32Array(r.len); let off=0; for (const c of r.chunks){ merged.set(c, off); off += c.length; }
  const ratio = sr/16000, outLen = Math.floor(merged.length/ratio), pcm = new Int16Array(outLen);
  for (let i=0;i<outLen;i++){ const v = Math.max(-1, Math.min(1, merged[Math.floor(i*ratio)])); pcm[i] = v<0 ? v*0x8000 : v*0x7FFF; }
  const b64 = bufToB64(wavEncode(pcm, 16000));
  try { const text = await sttTranscribe(b64);
    if (text){ draftEl.value = (draftEl.value ? draftEl.value.replace(/\s+$/,'') + ' ' : '') + text; draftEl.focus(); draftEl.dispatchEvent(new Event('input')); }
  } catch(err){ showToastGlobal('تبدیل صوت انجام نشد'); sttBar.style.display='block'; sttState.textContent = 'تبدیل صوت انجام نشد: ' + err.message; }
  recHide();
}

const recBar = document.getElementById('recbar'), recTimeEl = document.getElementById('rectime'), recDoneBtn = document.getElementById('recdone'), recCancelBtn = document.getElementById('reccancel');
let recTimer = null, recSecs = 0;
function faNum(t){ return String(t).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function recShow(){ footerEl.style.display='none'; recBar.style.display='flex'; recSecs=0; recTimeEl.textContent='۰:۰۰'; recDoneBtn.disabled=false; recCancelBtn.disabled=false;
  recTimer = setInterval(()=>{ recSecs++; recTimeEl.textContent = faNum(Math.floor(recSecs/60)) + ':' + faNum(String(recSecs%60).padStart(2,'0')); if (recSecs>=180) sttFinish(true); }, 1000); }
function recHide(){ if (recTimer) { clearInterval(recTimer); recTimer=null; } recBar.style.display='none'; footerEl.style.display='flex'; }
micBtn.addEventListener('click', async ()=>{ await sttStart(); if (sttRec) recShow(); });
recDoneBtn.addEventListener('click', ()=>sttFinish(true));
recCancelBtn.addEventListener('click', ()=>sttFinish(false));
