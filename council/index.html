<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اتاق تصمیم">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>اتاق تصمیم‌گیری</title>
<style>
:root{
    --bg:#0b141d; --panel:#17212b; --panel2:#242f3d; --line:#22344a;
    --text:#ffffff; --muted:#7f91a4; --accent:#4f8cff;
    --mehdi:#2f9e6e; --ceo:#7a5af8; --sgm:#d97706; --other:#64748b;
    --bub:#182533; --mine:#2b5278;
  }
  *{box-sizing:border-box}
  ::selection{background:rgba(79,140,255,.45)}
  body{margin:0;font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
  header{background:rgba(23,33,43,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 14px;display:flex;align-items:center;gap:11px;box-shadow:0 1px 6px rgba(0,0,0,.4);z-index:4}
  header .hava{width:42px;height:42px;border-radius:50%;background:#1e2740;box-shadow:0 0 0 2px #22344a}
  header .ht{min-width:0}
  header h1{font-size:15.5px;margin:0;font-weight:700;display:flex;align-items:center;gap:7px}
  header .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;flex:none}
  header .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  header .sp{flex:1}
  header label{font-size:12px;color:var(--muted)}
  header input{background:var(--panel2);border:1px solid transparent;color:var(--text);border-radius:16px;padding:6px 12px;font-family:inherit;font-size:13px;width:104px;outline:none;transition:.15s}
  header input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.25)}
  #msgs{flex:1;overflow-y:auto;padding:14px 12px 18px;display:flex;flex-direction:column;background:
    radial-gradient(1000px 480px at 85% -10%, rgba(43,82,120,.35) 0%, rgba(11,20,29,0) 60%),
    radial-gradient(800px 420px at 8% 108%, rgba(38,64,96,.28) 0%, rgba(11,20,29,0) 55%),
    radial-gradient(rgba(255,255,255,.028) 1px, transparent 1.4px),
    var(--bg);
    background-size:auto,auto,22px 22px,auto;scrollbar-width:thin;scrollbar-color:var(--panel2) transparent}
  #msgs::-webkit-scrollbar{width:6px}
  #msgs::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
  .daysep{position:sticky;top:6px;display:flex;justify-content:center;margin:12px 0 2px;z-index:3}
  .daysep span{background:rgba(26,40,56,.94);color:#a9bdd1;font-size:11.5px;padding:3px 13px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .row{display:flex;align-items:flex-end;gap:7px;max-width:86%;align-self:flex-start;cursor:pointer;margin-top:10px}
  .row.grp{margin-top:2px}
  .row.mine{align-self:flex-end}
  .ava{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .ava.sp{background:transparent;box-shadow:none}
  .av-mehdi{background:linear-gradient(135deg,#37c37e,#1e8a54)} .av-ceo{background:linear-gradient(135deg,#9a7bff,#683df0)} .av-sgm{background:linear-gradient(135deg,#f6a821,#dd7a06)} .av-other{background:linear-gradient(135deg,#7d8ea3,#52657a)}
  .bub{background:var(--bub);border:1px solid rgba(255,255,255,.045);border-radius:17px 17px 17px 6px;padding:8px 12px 7px;box-shadow:0 2px 7px rgba(0,0,0,.28);min-width:120px}
  .row.mine .bub{background:linear-gradient(135deg,#31639f,#2b5278);border-color:rgba(255,255,255,.06);border-radius:17px 17px 6px 17px}
  .aname{font-weight:700;font-size:13px;margin-bottom:2px}
  .a-mehdi{color:#5cc98f} .a-ceo{color:#a78bfa} .a-sgm{color:#fbbf24} .a-other{color:#94a3b8}
  .bub .body{font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
  .bub .body b{font-weight:700}
  .bub .quote{border-right:3px solid var(--accent);background:rgba(79,140,255,.12);border-radius:8px;padding:5px 9px;font-size:12.5px;color:#bcccdc;margin:2px 0 6px;white-space:pre-wrap;line-height:1.7}
  .bub .quote b{font-size:12.5px}
  .bub .quote{cursor:pointer}
  .bub .quote:active{background:rgba(79,140,255,.24)}
  .row.flash .bub{animation:flashring 1.8s ease}
  @keyframes flashring{0%,100%{box-shadow:0 2px 7px rgba(0,0,0,.28)}20%,55%{box-shadow:0 0 0 2px var(--accent),0 0 22px rgba(79,140,255,.65)}}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);background:#22344a;color:#e8f1fc;border:1px solid #33507a;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 8px 22px rgba(0,0,0,.45);white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .bub .meta{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:3px}
  .bub .time{color:rgba(255,255,255,.48);font-size:10.5px}
  .rbtn{background:none;border:none;color:rgba(255,255,255,.5);font-size:11.5px;padding:2px 7px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s}
  .rbtn:hover{color:#fff;background:rgba(255,255,255,.09)}
  .empty{margin:auto;color:var(--muted);font-size:13.5px;text-align:center;padding:30px 20px;line-height:2}
  #replybar{display:none;background:var(--panel);border-top:1px solid rgba(255,255,255,.05);border-right:3px solid var(--accent);padding:8px 14px;font-size:12.5px;color:var(--muted);align-items:center;gap:8px}
  #replybar b{color:var(--text)}
  #replybar button{background:none;border:none;color:var(--muted);font-size:15px;padding:2px 8px;cursor:pointer;font-family:inherit}
  footer{background:var(--panel);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;align-items:flex-end;box-shadow:0 -1px 6px rgba(0,0,0,.3)}
  footer textarea{flex:1;background:var(--panel2);border:1px solid #22344a;color:var(--text);border-radius:24px;padding:11px 17px;font-family:inherit;font-size:15px;resize:none;max-height:120px;min-height:46px;line-height:1.65;outline:none;transition:.15s}
  footer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.22)}
  footer button{width:46px;height:46px;flex:none;border-radius:50%;background:linear-gradient(135deg,#5b97ff,#2f6fe4);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 14px rgba(79,140,255,.4);transition:transform .12s}
  footer button:active{transform:scale(.93)}
  footer button svg{width:21px;height:21px;fill:#fff;transform:scaleX(-1)}
  footer button:disabled{opacity:.5}
  #fab{position:fixed;left:16px;bottom:96px;width:42px;height:42px;border-radius:50%;background:#1c2a3a;border:1px solid #2a3f55;color:#cfe1f5;display:none;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.45);cursor:pointer;z-index:5;padding:0}
  #fab svg{width:22px;height:22px;fill:currentColor}
  .hint{padding:5px 14px 8px;font-size:11px;color:var(--muted);background:var(--panel)}
  #tabs{display:flex;gap:8px;align-items:center;background:var(--panel);padding:8px 12px 2px}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 16px;font-family:inherit;font-size:13px;cursor:pointer}
  .tab.active{background:linear-gradient(135deg,#5b97ff,#2f6fe4);color:#fff;border-color:transparent}
  #dmBack{display:none;background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;cursor:pointer;padding:6px 4px}
  .member{display:flex;align-items:center;gap:11px;padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;border-radius:12px}
  .member:hover{background:rgba(255,255,255,.04)}
  .member .minfo{min-width:0;flex:1}
  .member .mname{font-weight:700;font-size:14.5px}
  .member .mlast{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .member .mtime{color:var(--muted);font-size:11px;flex:none}
  .member.unread .mlast{color:var(--text);font-weight:700}
  .ubadge{background:#e5484d;color:#fff;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;font-size:11.5px;padding:0 6px;flex:none;display:inline-block}
  #dmTabBadge{margin-inline-start:6px}
  .dmnote{color:var(--muted);font-size:12.5px;line-height:2;padding:14px 12px 6px;text-align:center}
  footer .attach{width:46px;height:46px;flex:none;border-radius:50%;background:var(--panel2);border:1px solid #22344a;color:#cfe1f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:.15s;box-shadow:none}
  footer .attach:hover{border-color:var(--accent);color:#fff}
  footer .attach svg{width:21px;height:21px;fill:currentColor;transform:none}
  .bub .photo{display:block;max-width:340px;width:100%;border-radius:12px;margin:2px 0 6px;cursor:zoom-in;background:#0b141d}
  .bub .photo:only-child{margin-bottom:2px}
  #previewbar{display:none;background:var(--panel);border-top:1px solid rgba(255,255,255,.05);padding:9px 14px;align-items:center;gap:10px}
  #previewbar img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none}
  #previewbar .pvinfo{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #previewbar .pvinfo b{color:var(--text);display:block;font-size:13px}
  #previewbar .pvbar{height:5px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden}
  #previewbar .pvbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .2s}
  #previewbar button{background:none;border:none;color:var(--muted);font-size:16px;padding:4px 9px;cursor:pointer;font-family:inherit}
  #newpill{position:fixed;left:50%;bottom:158px;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;display:none;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  #lightbox.open{display:flex}
  #lightbox img{max-width:100%;max-height:88vh;border-radius:10px;object-fit:contain}
  #lightbox .lbclose{position:absolute;top:14px;left:16px;background:rgba(255,255,255,.12);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;font-family:inherit}
  #lightbox .lbdl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;text-decoration:none;padding:9px 22px;border-radius:999px;font-size:13.5px;font-weight:700}
  @media (max-width:560px){ .row{max-width:93%} header label{display:none} .bub .photo{max-width:100%} }
</style>
</head>
<body>
<header>
  <img class="hava" src="./icon.svg" alt="">
  <div class="ht">
    <h1><span class="dot"></span>اتاق تصمیم‌گیری</h1>
    <div class="sub" id="roomsub">مهدی، مدیرعامل، ربات SGM و سایر اعضا</div>
  </div>
  <span class="sp"></span>
  <label>نام شما:</label>
  <input id="myname" value="مهدی">
</header>

<div id="tabs">
  <button id="tabRoom" class="tab active" type="button">اتاق اصلی</button>
  <button id="tabDM" class="tab" type="button">گفت‌وگوی خصوصی<span id="dmTabBadge" class="ubadge" style="display:none"></span></button>
  <button id="dmBack" type="button">بازگشت به فهرست اعضا</button>
</div>

<div id="msgs"></div>

<button id="fab" type="button" aria-label="رفتن به آخرین پیام"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></button>
<button id="newpill" type="button">پیام‌های جدید ↓</button>

<div id="toast"></div>
<div id="lightbox" role="dialog" aria-label="نمایش عکس">
  <button class="lbclose" id="lbclose" type="button" aria-label="بستن">✕</button>
  <img id="lbimg" src="" alt="عکس پیام">
  <a class="lbdl" id="lbdl" href="#" download>دانلود عکس</a>
</div>

<div id="replybar">
  <span>در پاسخ به <b id="replywho"></b>: <span id="replytext"></span></span>
  <span style="flex:1"></span>
  <button id="replycancel" type="button">لغو</button>
</div>

<div id="previewbar">
  <img id="pvimg" src="" alt="">
  <div class="pvinfo"><b id="pvname"></b><span id="pvsize"></span><div class="pvbar"><i id="pvprog"></i></div></div>
  <button id="pvcancel" type="button" aria-label="لغو عکس">✕</button>
</div>

<footer>
  <button id="attach" class="attach" type="button" aria-label="ارسال عکس"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg></button>
  <input id="fileinput" type="file" accept="image/*" hidden>
  <textarea id="draft" placeholder="پیامتان را بنویسید…"></textarea>
  <button id="send" type="button" aria-label="ارسال"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</footer>
<div class="hint">پیام‌ها هر ۳ ثانیه تازه می‌شوند. برای ارسال عکس، روی دکمهٔ گیره بزنید؛ عکس را می‌توانید از گالری یا دوربین انتخاب کنید.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ktnixxbkzapziqplrnmo.supabase.co";
const KEY = "sb_publishable_pD5qO7dvJP7Xik5Aw9xUsw_A6qCeArA";
const API = SUPABASE_URL + "/rest/v1/council_messages";
const HEADERS = { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" };
const STORAGE = SUPABASE_URL + "/storage/v1/object/council-images";
const STORAGE_PUBLIC = SUPABASE_URL + "/storage/v1/object/public/council-images";
const MAX_PHOTO = 5 * 1024 * 1024;

const msgsEl = document.getElementById('msgs');
const draftEl = document.getElementById('draft');
const sendBtn = document.getElementById('send');
const nameEl = document.getElementById('myname');
const replybar = document.getElementById('replybar');
const replywho = document.getElementById('replywho');
const replytext = document.getElementById('replytext');
let replyTo = null;
let byId = {};
let lastCount = -1;
let selectedFile = null;
let selectedPreviewUrl = null;
let uploading = false;

nameEl.value = localStorage.getItem('council_name') || 'مهدی';
nameEl.addEventListener('change', () => localStorage.setItem('council_name', nameEl.value.trim() || 'مهدی'));

function authorClass(a){
  if (a === 'مهدی') return 'a-mehdi';
  if (a === 'مدیرعامل') return 'a-ceo';
  if (a === 'ربات SGM') return 'a-sgm';
  return 'a-other';
}
function avClass(a){
  if (a === 'مهدی') return 'av-mehdi';
  if (a === 'مدیرعامل') return 'av-ceo';
  if (a === 'ربات SGM') return 'av-sgm';
  return 'av-other';
}
function fmtClock(iso){
  try { return new Date(iso).toLocaleTimeString('fa-IR', { timeZone:'Asia/Tehran', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return ''; }
}
function fmtBody(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s){ return esc(String(s)).replace(/"/g, '&quot;'); }
function quoteText(m){
  if (m.image_url && !(m.body || '').trim()) return '📷 عکس';
  if (m.image_url) return '📷 عکس — ' + (m.body || '').slice(0, 60);
  return (m.body || '').slice(0, 90);
}
function fmtTime(iso){
  try { return new Date(iso).toLocaleString('fa-IR', { timeZone:'Asia/Tehran', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return iso; }
}

// ===== Room messages (incremental loading: only new rows are fetched
// and appended; the list is never rebuilt when nothing changed) =====
let roomRows = [];
let roomIds = new Set();
let roomLastTs = '';
let roomFull = true;
let roomRendered = false;
let roomPollN = 0;
function invalidateRoom(){ roomFull = true; }
function dayKeyOf(iso){ return new Intl.DateTimeFormat('fa-IR', { timeZone: 'Asia/Tehran', year: 'numeric', month: 'numeric', day: 'numeric' }).format(new Date(iso)); }
function dayLabelOf(iso){
  const k = dayKeyOf(iso);
  if (k === dayKeyOf(new Date().toISOString())) return 'امروز';
  if (k === dayKeyOf(new Date(Date.now() - 86400000).toISOString())) return 'دیروز';
  return new Intl.DateTimeFormat('fa-IR', { timeZone: 'Asia/Tehran', weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(iso));
}
function roomRowHtml(m, prev){
  let q = '';
  if (m.reply_to && byId[m.reply_to]) {
    const t = byId[m.reply_to];
    q = '<div class="quote" data-target="' + t.id + '" title="رفتن به پیام اصلی"><b class="' + authorClass(t.author) + '">' + esc(t.author) + '</b><br>' + fmtBody(quoteText(t)) + '</div>';
  }
  const isMine = m.author === (nameEl.value.trim() || 'مهدی');
  const newDay = !prev || dayKeyOf(prev.created_at) !== dayKeyOf(m.created_at);
  let html = '';
  if (newDay) html += '<div class="daysep"><span>' + dayLabelOf(m.created_at) + '</span></div>';
  const grouped = !newDay && !!prev && prev.author === m.author && (new Date(m.created_at) - new Date(prev.created_at) < 7 * 60000);
  const ava = isMine ? '' : (grouped ? '<div class="ava sp"></div>' : '<div class="ava ' + avClass(m.author) + '">' + esc(m.author.trim().charAt(0)) + '</div>');
  const aname = (isMine || grouped) ? '' : '<div class="aname ' + authorClass(m.author) + '">' + esc(m.author) + '</div>';
  const photo = m.image_url ? '<img class="photo" src="' + escAttr(m.image_url) + '" data-full="' + escAttr(m.image_url) + '" alt="عکس" loading="lazy">' : '';
  const bodyHtml = (m.body || '').trim() ? '<div class="body">' + fmtBody(m.body) + '</div>' : '';
  html += '<div class="row' + (isMine ? ' mine' : '') + (grouped ? ' grp' : '') + '" data-id="' + m.id + '">' + ava +
    '<div class="bub">' + aname + q + photo + bodyHtml +
    '<div class="meta"><span class="time">' + fmtClock(m.created_at) + '</span>' +
    '<button class="rbtn" type="button" data-reply="' + m.id + '">پاسخ</button></div>' +
    '</div></div>';
  return html;
}
function setReply(m){
  replyTo = m.id;
  replywho.textContent = m.author;
  replytext.textContent = quoteText(m);
  replybar.style.display = 'flex';
  draftEl.focus();
}
function showToast(msg){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function jumpTo(id){
  const row = msgsEl.querySelector('.row[data-id="' + id + '"]');
  if (!row) { showToast('پیام اصلی در فهرست فعلی نیست'); return; }
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.remove('flash');
  void row.offsetWidth;
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 1900);
}
msgsEl.addEventListener('click', e => {
  if (view !== 'room') return;
  const photo = e.target.closest('.photo');
  if (photo) { e.stopPropagation(); openLightbox(photo.dataset.full || photo.src); return; }
  const quote = e.target.closest('.quote[data-target]');
  if (quote) { e.stopPropagation(); jumpTo(quote.dataset.target); return; }
  const btn = e.target.closest('.rbtn[data-reply]');
  if (btn) { e.stopPropagation(); const m = byId[btn.dataset.reply]; if (m) setReply(m); return; }
  const row = e.target.closest('.row');
  if (row) { const m = byId[row.dataset.id]; if (m) setReply(m); }
});
function updateRoomSub(){
  const subEl = document.getElementById('roomsub');
  if (subEl && roomRows.length) {
    const members = new Set(roomRows.map(m => m.author)).size;
    subEl.textContent = members + ' عضو • آخرین فعالیت ' + fmtClock(roomRows[roomRows.length - 1].created_at);
  }
}
function renderRoomFull(){
  let html = '';
  let prev = null;
  roomRows.forEach(m => { html += roomRowHtml(m, prev); prev = m; });
  msgsEl.innerHTML = html || '<div class="empty">هنوز پیامی نیست؛ اولین نفر باش که بحث را شروع می‌کند.</div>';
  roomRendered = true;
  updateRoomSub();
  msgsEl.scrollTop = msgsEl.scrollHeight;
  const pill = document.getElementById('newpill');
  if (pill) pill.style.display = 'none';
}
async function load(){
  if (view !== 'room') return;
  try {
    roomPollN++;
    if (roomFull) {
      const r = await fetch(API + "?select=*&order=created_at.desc&limit=500", { headers: HEADERS });
      if (!r.ok) return;
      const rows = (await r.json()).reverse();
      roomRows = rows;
      roomIds = new Set(rows.map(m => m.id));
      byId = {};
      rows.forEach(m => byId[m.id] = m);
      roomLastTs = rows.length ? rows[rows.length - 1].created_at : '';
      roomFull = false;
      renderRoomFull();
      return;
    }
    if (roomPollN % 20 === 0) {
      const r = await fetch(API + "?select=id&order=created_at.desc&limit=500", { headers: HEADERS });
      if (r.ok) {
        const ids = new Set((await r.json()).map(m => m.id));
        let stale = ids.size !== roomIds.size;
        if (!stale) for (const id of roomIds) { if (!ids.has(id)) { stale = true; break; } }
        if (stale) { invalidateRoom(); return load(); }
      }
    }
    if (!roomLastTs) { invalidateRoom(); return load(); }
    const r = await fetch(API + "?select=*&order=created_at.asc&created_at=gte." + encodeURIComponent(roomLastTs), { headers: HEADERS });
    if (!r.ok) return;
    const rows = await r.json();
    const fresh = rows.filter(m => !roomIds.has(m.id));
    if (!roomRendered) {
      fresh.forEach(m => { roomIds.add(m.id); byId[m.id] = m; roomRows.push(m); });
      if (fresh.length) roomLastTs = fresh[fresh.length - 1].created_at;
      renderRoomFull();
      return;
    }
    if (!fresh.length) return;
    const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 160;
    fresh.forEach(m => { roomIds.add(m.id); byId[m.id] = m; });
    let html = '';
    let prev = roomRows.length ? roomRows[roomRows.length - 1] : null;
    fresh.forEach(m => { html += roomRowHtml(m, prev); prev = m; });
    roomRows = roomRows.concat(fresh);
    roomLastTs = fresh[fresh.length - 1].created_at;
    const emptyEl = msgsEl.querySelector('.empty');
    if (emptyEl) emptyEl.remove();
    msgsEl.insertAdjacentHTML('beforeend', html);
    updateRoomSub();
    const pill = document.getElementById('newpill');
    if (nearBottom) {
      msgsEl.scrollTop = msgsEl.scrollHeight;
      if (pill) pill.style.display = 'none';
    } else if (pill) {
      pill.textContent = fresh.length + ' پیام جدید ↓';
      pill.style.display = 'block';
    }
  } catch(e) { /* silent retry next tick */ }
}

document.getElementById('replycancel').addEventListener('click', () => {

function showToastGlobal(msg){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToastGlobal._h);
  showToastGlobal._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function clearPhoto(){
  selectedFile = null;
  if (selectedPreviewUrl) URL.revokeObjectURL(selectedPreviewUrl);
  selectedPreviewUrl = null;
  const bar = document.getElementById('previewbar');
  if (bar) bar.style.display = 'none';
  const fi = document.getElementById('fileinput');
  if (fi) fi.value = '';
  const prog = document.getElementById('pvprog');
  if (prog) prog.style.width = '0';
}
function onFilePicked(file){
  if (!file) return;
  if (!file.type || file.type.indexOf('image/') !== 0) { showToastGlobal('فقط فایل عکس انتخاب کنید'); return; }
  if (file.size > MAX_PHOTO) { showToastGlobal('حجم عکس باید کمتر از ۵ مگابایت باشد'); return; }
  clearPhoto();
  selectedFile = file;
  selectedPreviewUrl = URL.createObjectURL(file);
  document.getElementById('pvimg').src = selectedPreviewUrl;
  document.getElementById('pvname').textContent = file.name || 'عکس';
  document.getElementById('pvsize').textContent = (file.size / 1024).toFixed(0) + ' کیلوبایت — برای ارسال، دکمهٔ ارسال را بزنید';
  document.getElementById('previewbar').style.display = 'flex';
  draftEl.focus();
}
function prepareImage(file){
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxSide = 1600;
      if (img.width <= maxSide && img.height <= maxSide) { resolve(file); return; }
      const scale = Math.min(maxSide / img.width, maxSide / img.height);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
function uploadPhoto(file){
  return prepareImage(file).then(blob => {
    const ext = (blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : blob.type === 'image/gif' ? 'gif' : 'jpg');
    const path = 'room/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', STORAGE + '/' + path);
      xhr.setRequestHeader('apikey', KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
      xhr.setRequestHeader('Content-Type', blob.type || 'image/jpeg');
      xhr.setRequestHeader('x-upsert', 'false');
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          const prog = document.getElementById('pvprog');
          if (prog) prog.style.width = pct + '%';
          const sz = document.getElementById('pvsize');
          if (sz) sz.textContent = 'در حال آپلود… ' + pct + '٪';
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve(STORAGE_PUBLIC + '/' + path);
        else reject(new Error('upload ' + xhr.status));
      };
      xhr.onerror = () => reject(new Error('network'));
      xhr.send(blob);
    });
  });
}
async function send(){
  if (view === 'dm') { return sendDM(); }
  const body = draftEl.value.trim();
  if (!body && !selectedFile) return;
  if (uploading) return;
  uploading = true;
  sendBtn.disabled = true;
  try {
    let imageUrl = null;
    if (selectedFile) {
      try { imageUrl = await uploadPhoto(selectedFile); }
      catch (e) { showToastGlobal('آپلود عکس ناموفق بود؛ دوباره تلاش کنید'); return; }
    }
    const payload = { author: nameEl.value.trim() || 'مهدی', body: body, image_url: imageUrl, reply_to: replyTo };
    const r = await fetch(API, { method: 'POST', headers: { ...HEADERS, 'Prefer': 'return=minimal' }, body: JSON.stringify(payload) });
    if (r.ok) {
      draftEl.value = '';
      draftEl.style.height = 'auto';
      clearPhoto();
      replyTo = null; replybar.style.display = 'none';
      await load();
      msgsEl.scrollTop = msgsEl.scrollHeight;
    } else {
      showToastGlobal('ارسال پیام ناموفق بود');
    }
  } finally { uploading = false; sendBtn.disabled = false; }
}
sendBtn.addEventListener('click', send);
draftEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
draftEl.addEventListener('input', () => {
  draftEl.style.height = 'auto';
  draftEl.style.height = Math.min(draftEl.scrollHeight, 120) + 'px';

});

// ===== Private 1-to-1 conversations =====
const API_DM = SUPABASE_URL + "/rest/v1/council_private_messages";
const MEMBERS = ['مهدی','مدیرعامل','Wally','Grok','Manus','مانی','همراه','Cooper','Spark'];
let view = 'room';
let partner = null;
let byIdDM = {};
let lastDMSig = '';
let replyToDM = null;
const tabRoom = document.getElementById('tabRoom');
const tabDM = document.getElementById('tabDM');
const dmBack = document.getElementById('dmBack');

function meName(){ return nameEl.value.trim() || 'مهدی'; }
function setTabs(){
  tabRoom.classList.toggle('active', view === 'room');
  tabDM.classList.toggle('active', view === 'dm');
  dmBack.style.display = (view === 'dm' && partner) ? 'inline-block' : 'none';
  const att = document.getElementById('attach'); if (att) att.style.display = view === 'dm' ? 'none' : '';
  draftEl.placeholder = (view === 'dm' && partner) ? ('پیام خصوصی به ' + partner + '…') : (view === 'dm' ? 'اول یک عضو را از فهرست انتخاب کنید…' : 'پیامتان را بنویسید…');
}
tabRoom.addEventListener('click', () => { view = 'room'; partner = null; replyToDM = null; replybar.style.display = 'none'; setTabs(); load(); });
tabDM.addEventListener('click', () => { view = 'dm'; partner = null; replyTo = null; replybar.style.display = 'none'; setTabs(); lastDMSig = ''; loadDM(); });
dmBack.addEventListener('click', () => { partner = null; replyToDM = null; replybar.style.display = 'none'; setTabs(); lastDMSig = ''; loadDM(); });

const DMREAD_KEY = 'council_dm_read_v1';
function dmReadMap(){ try { return JSON.parse(localStorage.getItem(DMREAD_KEY) || '{}'); } catch(e) { return {}; } }
function dmMarkRead(p, iso){ const map = dmReadMap(); map[meName() + '|' + p] = iso; try { localStorage.setItem(DMREAD_KEY, JSON.stringify(map)); } catch(e) {} }
function dmUnread(rows, me){
  const map = dmReadMap(); const per = {}; let total = 0;
  rows.forEach(m => { if (m.recipient === me && m.sender !== me) { const since = map[me + '|' + m.sender] || ''; if (m.created_at > since) { per[m.sender] = (per[m.sender] || 0) + 1; total++; } } });
  return { per, total };
}
function paintDMBadge(total){ const b = document.getElementById('dmTabBadge'); if (!b) return; if (total > 0) { b.textContent = total; b.style.display = 'inline-block'; } else { b.style.display = 'none'; } }

let dmRows = [];
let dmIds = new Set();
let dmLastTs = '';
let dmFull = true;
let dmMe = '';
let dmPollN = 0;
function invalidateDM(){ dmFull = true; }
async function loadDM(){
  try {
    const me = meName();
    if (me !== dmMe) { dmMe = me; dmFull = true; }
    dmPollN++;
    let changed = false;
    const orFilter = encodeURIComponent("(sender.eq." + me + ",recipient.eq." + me + ")");
    if (dmFull) {
      const q = API_DM + "?select=*&order=created_at.asc&limit=1000&or=" + orFilter;
      const r = await fetch(q, { headers: HEADERS });
      if (!r.ok) return;
      dmRows = await r.json();
      dmIds = new Set(dmRows.map(m => m.id));
      dmLastTs = dmRows.length ? dmRows[dmRows.length - 1].created_at : '';
      dmFull = false;
      changed = true;
    } else {
      if (dmPollN % 20 === 0) {
        const q = API_DM + "?select=id&or=" + orFilter;
        const r = await fetch(q, { headers: HEADERS });
        if (r.ok) {
          const ids = new Set((await r.json()).map(m => m.id));
          let stale = ids.size !== dmIds.size;
          if (!stale) for (const id of dmIds) { if (!ids.has(id)) { stale = true; break; } }
          if (stale) { invalidateDM(); return loadDM(); }
        }
      }
      if (!dmLastTs) { invalidateDM(); return loadDM(); }
      const q = API_DM + "?select=*&order=created_at.asc&created_at=gte." + encodeURIComponent(dmLastTs) + "&or=" + orFilter;
      const r = await fetch(q, { headers: HEADERS });
      if (!r.ok) return;
      const rows = await r.json();
      const fresh = rows.filter(m => !dmIds.has(m.id));
      if (fresh.length) {
        fresh.forEach(m => { dmIds.add(m.id); dmRows.push(m); });
        dmLastTs = fresh[fresh.length - 1].created_at;
        changed = true;
      }
    }
    paintDMBadge(dmUnread(dmRows, me).total);
    if (view !== 'dm') return;
    const sig = dmRows.length + ':' + (dmRows.length ? dmRows[dmRows.length - 1].id + ':' + dmRows[dmRows.length - 1].body.length : '') + ':' + (partner || '') + ':' + JSON.stringify(dmReadMap());
    if (!changed && sig === lastDMSig) return;
    lastDMSig = sig;
    byIdDM = {};
    dmRows.forEach(m => byIdDM[m.id] = m);
    if (partner) renderDMConv(dmRows, me); else renderDMList(dmRows, me);
  } catch(e) {}
}

function renderDMList(rows, me){
  roomRendered = false;
  const names = MEMBERS.slice();
  rows.forEach(m => { const o = m.sender === me ? m.recipient : m.sender; if (!names.includes(o)) names.push(o); });
  const un = dmUnread(rows, me).per;
  const entries = names.filter(n => n !== me).map(n => {
    const conv = rows.filter(m => (m.sender === me && m.recipient === n) || (m.sender === n && m.recipient === me));
    return { n, last: conv.length ? conv[conv.length - 1] : null, unread: un[n] || 0 };
  });
  entries.sort((a, b) => {
    if (a.last && b.last) return a.last.created_at < b.last.created_at ? 1 : -1;
    if (a.last) return -1;
    if (b.last) return 1;
    return 0;
  });
  let html = '<div class="dmnote">گفت‌وگوی خصوصی فقط میان شما و طرف مقابل نمایش داده می‌شود.<br>تصمیم‌ها، رأی‌گیری‌ها و مصوبات همچنان در اتاق اصلی ثبت می‌ماند.</div>';
  entries.forEach(e => {
    const n = e.n; const last = e.last;
    html += '<div class="member' + (e.unread ? ' unread' : '') + '" data-partner="' + esc(n) + '"><div class="ava ' + avClass(n) + '">' + esc(n.trim().charAt(0)) + '</div>' +
      '<div class="minfo"><div class="mname ' + authorClass(n) + '">' + esc(n) + '</div>' +
      '<div class="mlast">' + (last ? esc((last.sender === me ? 'شما: ' : '') + last.body.slice(0, 60)) : 'هنوز گفت‌وگویی نیست') + '</div></div>' +
      (last ? '<div class="mtime">' + fmtClock(last.created_at) + '</div>' : '') +
      (e.unread ? '<span class="ubadge">' + e.unread + '</span>' : '') + '</div>';
  });
  msgsEl.innerHTML = html;
  msgsEl.querySelectorAll('.member').forEach(el => {
    el.addEventListener('click', () => { partner = el.dataset.partner; setTabs(); lastDMSig = ''; loadDM(); });
  });
  msgsEl.scrollTop = 0;
}

function renderDMConv(rows, me){
  roomRendered = false;
  const conv = rows.filter(m => (m.sender === me && m.recipient === partner) || (m.sender === partner && m.recipient === me));
  const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 160;
  const dayKey = (iso) => new Intl.DateTimeFormat('fa-IR', { timeZone: 'Asia/Tehran', year: 'numeric', month: 'numeric', day: 'numeric' }).format(new Date(iso));
  let html = '';
  let prev = null;
  conv.forEach(m => {
    let q = '';
    if (m.reply_to && byIdDM[m.reply_to]) {
      const t = byIdDM[m.reply_to];
      q = '<div class="quote" data-target="' + t.id + '"><b class="' + authorClass(t.sender) + '">' + esc(t.sender) + '</b><br>' + fmtBody(t.body.slice(0, 90)) + '</div>';
    }
    const isMine = m.sender === me;
    const newDay = !prev || dayKey(prev.created_at) !== dayKey(m.created_at);
    if (newDay) html += '<div class="daysep"><span>' + dayKey(m.created_at) + '</span></div>';
    const ava = isMine ? '' : '<div class="ava ' + avClass(m.sender) + '">' + esc(m.sender.trim().charAt(0)) + '</div>';
    const aname = isMine ? '' : '<div class="aname ' + authorClass(m.sender) + '">' + esc(m.sender) + '</div>';
    html += '<div class="row' + (isMine ? ' mine' : '') + '" data-id="' + m.id + '">' + ava +
      '<div class="bub">' + aname + q +
      '<div class="body">' + fmtBody(m.body) + '</div>' +
      '<div class="meta"><span class="time">' + fmtClock(m.created_at) + '</span>' +
      '<button class="rbtn" type="button" data-replydm="' + m.id + '">پاسخ</button>' +
      (isMine ? '<button class="rbtn" type="button" data-deldm="' + m.id + '">حذف</button>' : '') +
      '</div></div></div>';
    prev = m;
  });
  msgsEl.innerHTML = html || '<div class="empty">هنوز پیامی در این گفت‌وگوی خصوصی نیست.</div>';
  msgsEl.querySelectorAll('.rbtn[data-replydm]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); const m = byIdDM[btn.dataset.replydm]; if (!m) return;
      replyToDM = m.id; replywho.textContent = m.sender; replytext.textContent = m.body.slice(0, 60); replybar.style.display = 'flex'; draftEl.focus(); });
  });
  msgsEl.querySelectorAll('.rbtn[data-deldm]').forEach(btn => {
    btn.addEventListener('click', async e => { e.stopPropagation();
      const id = btn.dataset.deldm;
      try { await fetch(API_DM + "?id=eq." + id, { method: 'DELETE', headers: HEADERS }); } catch(err) {}
      dmRows = dmRows.filter(x => x.id !== id); dmIds.delete(id);
      lastDMSig = ''; loadDM(); });
  });
  msgsEl.querySelectorAll('.quote[data-target]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation();
      const row = msgsEl.querySelector('.row[data-id="' + el.dataset.target + '"]');
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
      setTimeout(() => row.classList.remove('flash'), 1900); });
  });
  const lastIn = conv.filter(m => m.sender === partner).pop();
  if (lastIn) { dmMarkRead(partner, lastIn.created_at); paintDMBadge(dmUnread(rows, me).total); }
  if (nearBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function sendDM(){
  if (!partner) return;
  const body = draftEl.value.trim();
  if (!body) return;
  sendBtn.disabled = true;
  try {
    const payload = { sender: meName(), recipient: partner, body: body, reply_to: replyToDM };
    const r = await fetch(API_DM, { method: 'POST', headers: { ...HEADERS, 'Prefer': 'return=minimal' }, body: JSON.stringify(payload) });
    if (r.ok) {
      draftEl.value = ''; draftEl.style.height = 'auto';
      replyToDM = null; replybar.style.display = 'none';
      lastDMSig = ''; await loadDM();
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }
  } finally { sendBtn.disabled = false; }
}

setTabs();
load();
loadDM();
let pollTimer = setInterval(() => { if (view === 'room') load(); loadDM(); }, 3000);
function startPolling(ms){ clearInterval(pollTimer); pollTimer = setInterval(() => { if (view === 'room') load(); loadDM(); }, ms); }
function setLiveHint(on){
  const h = document.querySelector('.hint');
  if (!h) return;
  h.textContent = on
    ? 'پیام‌ها به‌صورت زنده می‌رسند. برای ارسال عکس، روی دکمهٔ گیره بزنید؛ عکس را می‌توانید از گالری یا دوربین انتخاب کنید.'
    : 'پیام‌ها هر ۳ ثانیه تازه می‌شوند. برای ارسال عکس، روی دکمهٔ گیره بزنید؛ عکس را می‌توانید از گالری یا دوربین انتخاب کنید.';
}
function startRealtime(){
  try {
    if (!window.supabase || !window.supabase.createClient) return false;
    const rt = window.supabase.createClient(SUPABASE_URL, KEY);
    rt.channel('council-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'council_messages' }, () => { if (view === 'room') load(); })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'council_messages' }, () => { invalidateRoom(); if (view === 'room') load(); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'council_private_messages' }, () => { loadDM(); })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'council_private_messages' }, () => { invalidateDM(); loadDM(); })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') { startPolling(30000); setLiveHint(true); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') { startPolling(3000); setLiveHint(false); }
      });
    return true;
  } catch (e) { return false; }
}
startRealtime();
