    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("sgm-theme"); } catch (e) { }
            if (t !== "dark" && t !== "light") t = "dark";
            document.documentElement.setAttribute("data-theme", t);
            window.sgm = {
                getTheme: function () { return document.documentElement.getAttribute("data-theme") || "light"; },
                setTheme: function (v) {
                    document.documentElement.setAttribute("data-theme", v);
                    try { localStorage.setItem("sgm-theme", v); } catch (e) { }
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute("content", v === "dark" ? "#0a0e17" : "#ffffff");
                },
                focusEl: function (el) { try { if (el && el.focus) el.focus(); } catch (e) { } }
            };
        })();
    </script>

    <script>
        (function () {

                resize(); for (var i = 0; i < (mobile ? 10 : 58); i++) ps.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .25, vy: .1 + Math.random() * .35, r: 1 + Math.random() * 2, hue: 190 + Math.random() * 100 });
                addEventListener("resize", resize, { passive: true }); addEventListener("pointermove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
                function frame(t) { x.clearRect(0, 0, w, h); ps.forEach(function (p, i) { var dx = p.x - mouse.x, dy = p.y - mouse.y, dist = Math.hypot(dx, dy) || 1; if (dist < 145) { p.vx += dx / dist * .018; p.vy += dy / dist * .018; } p.x += p.vx; p.y += p.vy; if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10; if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10; x.fillStyle = "hsla(" + p.hue + ",90%,74%,.55)"; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); if (!mobile) for (var j = i + 1; j < ps.length; j++) { var q = ps[j], dd = Math.hypot(p.x - q.x, p.y - q.y); if (dd < 110) { x.strokeStyle = "hsla(220,85%,75%," + ((1 - dd / 110) * .18) + ")"; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke(); } } }); mobile ? setTimeout(function () { requestAnimationFrame(frame); }, 50) : requestAnimationFrame(frame); }
