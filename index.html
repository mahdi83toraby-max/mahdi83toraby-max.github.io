    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("sgm-theme"); } catch (e) { }
            if (t !== "dark" && t !== "light") t = "light";
            document.documentElement.setAttribute("data-theme", t);
            window.sgm = {
                getTheme: function () { return document.documentElement.getAttribute("data-theme") || "light"; },
                setTheme: function (v) {
                    document.documentElement.setAttribute("data-theme", v);
                    try { localStorage.setItem("sgm-theme", v); } catch (e) { }
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute("content", v === "dark" ? "#10141b" : "#ffffff");
                },
                focusEl: function (el) { try { if (el && el.focus) el.focus(); } catch (e) { } }
            };
        })();
    </script>
